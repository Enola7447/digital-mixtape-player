<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Mixtape Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cassette">
    <div class="label-area">
      <span class="title">MIX TAPE</span>
      <div class="line"></div>
    </div>

    <div class="tape-window">
      <div class="reel left">
        <div class="hub">
          <div class="center-hole"></div>
        </div>
      </div>
      <div class="reel right">
        <div class="hub">
          <div class="center-hole"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
